name: Benchmark Track

on:
  workflow_call:
    inputs:
      profile:
        description: reduction-threshold profile
        required: true
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: reduction-threshold profile
        required: true
        default: lower
        type: choice
        options:
          - lower
          - upper

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  benchmark:
    name: benchmark (IRS reduction threshold — ${{ inputs.profile }})
    runs-on: ubuntu-24.04
    # The only bound on how long a submission may take. `submit.py` keeps no
    # deadline of its own: it waits for a verifier slot and then polls until the
    # service reaches a terminal state, so this number alone decides when to
    # stop. Two budgets in two files disagreed once already -- a 2400s poll
    # sized for v3's 1200s challenge, inside a 50-minute cap -- which is the
    # reason there is now one.
    #
    # It has to cover the worst honest case: waiting for a slot while the fleet
    # is full, then a full-length verification. At v4's 1500s that is about 50
    # minutes; the rest is headroom for a queue deeper than the fleet.
    #
    # 180 rather than a fresh number, because production already runs 180 and a
    # sync should not quietly reduce a live limit to match a value chosen here.
    timeout-minutes: 180
    env:
      BASE: https://proximity-prize.zksecurity.xyz
      PROFILE: ${{ inputs.profile }}

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Resolve immutable challenge policy
        shell: bash
        run: |
          case "$PROFILE" in
            lower)
              challenge=proximity-prize-reduction-lower
              ;;
            upper)
              challenge=proximity-prize-reduction-upper
              ;;
            *)
              echo "unknown benchmark profile: $PROFILE" >&2
              exit 2
              ;;
          esac
          echo "CHALLENGE=$challenge" >> "$GITHUB_ENV"
          echo "CHALLENGE_VERSION=$(python3 scripts/challenges.py version "$challenge")" >> "$GITHUB_ENV"

      - name: Benchmark with independent verifier
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: python3 scripts/submit.py > verifier-result.json

      - name: Write Yukon score
        run: python3 scripts/write-verifier-score.py "$PROFILE" verifier-result.json

      - name: Explain the rejection
        # The reason exists but nobody reads it. Yukon's PR comment on failure is
        # `benchmark_failed: workflow run concluded failure at step ...` plus a
        # link, while a success gets a table of score and verification flags. So
        # the one person who needs the detail -- whoever's proof was refused --
        # is the one who has to go digging for it in a log.
        #
        # The job summary is what that link opens onto, so put it there.
        if: failure() && hashFiles('verifier-result.json')
        run: python3 scripts/explain-rejection.py verifier-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Show the verifier's own answer
        # Only on failure, and only the service's response -- which already
        # carries `failure.message`. Without this the job reports a bare
        # stage/code and the reason has to be read out of the database.
        if: failure() && hashFiles('verifier-result.json')
        run: cat verifier-result.json

      - name: Upload score
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-score-irs-reduction-threshold-${{ inputs.profile }}
          path: .yukon/*-score.json
          # `.yukon` is a dotted directory, and upload-artifact defaults
          # `include-hidden-files` to false -- which skips hidden directories
          # too, so the score written there matched nothing and the upload
          # failed with "No files were found" on a run that had verified.
          include-hidden-files: true
          if-no-files-found: error
