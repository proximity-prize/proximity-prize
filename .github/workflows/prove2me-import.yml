name: Prepare shared Prove2Me proofs

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish checked files (requires separately approved service configuration)
  schedule:
    - cron: '23 7 * * *'

# The schedule is inert until maintainers explicitly enable it after hosted acceptance.
permissions:
  contents: read
concurrency:
  group: prove2me-import
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || vars.PROVE2ME_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      work: ${{ steps.inventory.outputs.work }}
      deadline: ${{ steps.inventory.outputs.deadline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install boto3==1.42.63
      - id: inventory
        env:
          PROVE2ME_STATE: ${{ vars.PROVE2ME_STATE }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROVE2ME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROVE2ME_R2_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/prove2me/batch.py inventory --directory batch --state "${PROVE2ME_STATE:-.yukon/prove2me}"
          python3 - <<'PY'
          import json, os
          data = json.load(open('batch/inventory.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"work={'true' if data['work'] else 'false'}\ndeadline={data['deadline']}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prove2me-inventory
          path: batch/*.json
          retention-days: 14

  prepare:
    needs: inventory
    if: needs.inventory.outputs.work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: prove2me/prove2me_workspace
          ref: 6b46503a65c3a4252170ed5ca984a796b5a5b6b4
          path: upstream
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prove2me-inventory
          path: batch
      # No R2, Prove2Me or deployment credentials enter this job.
      - name: Retrieve the immutable native source
        run: python3 scripts/prove2me/batch.py prepare --directory batch
      - name: Restore a previously checked identical batch
        id: checked
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: batch/checked.json
          key: prove2me-checked-${{ hashFiles('scripts/prove2me/*.py', 'scripts/prove2me/*.lean', 'scripts/prove2me/*.json', '.github/workflows/prove2me-import.yml') }}-${{ hashFiles('batch/work.json') }}
      - name: Restore interrupted native preparation
        if: steps.checked.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            batch/source/.lake
            batch/facts
            batch/prepared.json
          key: prove2me-native-${{ hashFiles('scripts/prove2me/*.json') }}-${{ hashFiles('batch/work.json') }}-${{ github.run_id }}
          restore-keys: prove2me-native-${{ hashFiles('scripts/prove2me/*.json') }}-${{ hashFiles('batch/work.json') }}-
      - name: Install pinned Lean dependencies
        if: steps.checked.outputs.cache-hit != 'true'
        working-directory: batch/source
        run: |
          ./setup.sh
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Extract exact Lean structure
        if: steps.checked.outputs.cache-hit != 'true'
        env:
          DEADLINE: ${{ needs.inventory.outputs.deadline }}
        run: python3 scripts/prove2me/batch.py extract --directory batch --upstream upstream --deadline "$DEADLINE"
      - name: Select useful results and generate platform files
        if: steps.checked.outputs.cache-hit != 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: scripts/prove2me/agent-prompt.md
          output-file: batch/agent-summary.txt
      - name: Restore the original inventory before checking agent output
        if: steps.checked.outputs.cache-hit != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prove2me-inventory
          path: batch
      - name: Restore checker and check the generated files
        if: steps.checked.outputs.cache-hit != 'true'
        env:
          TRUSTED_SHA: ${{ github.sha }}
          DEADLINE: ${{ needs.inventory.outputs.deadline }}
        run: |
          git restore --source="$TRUSTED_SHA" -- scripts/prove2me
          python3 scripts/prove2me/batch.py check --directory batch --deadline "$DEADLINE"
      - name: Save checked work for interrupted publication
        if: steps.checked.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: batch/checked.json
          key: ${{ steps.checked.outputs.cache-primary-key }}
      - name: Keep bounded preparation progress
        if: always() && steps.checked.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            batch/source/.lake
            batch/facts
            batch/prepared.json
          key: prove2me-native-${{ hashFiles('scripts/prove2me/*.json') }}-${{ hashFiles('batch/work.json') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prove2me-checked
          path: batch/checked.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain preparation progress for the next batch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prove2me-preparation
          path: |
            batch/work.json
            batch/prepared.json
            batch/facts
            batch/agent-summary.txt
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [inventory, prepare]
    if: vars.PROVE2ME_PUBLICATION_READY == 'true' && (inputs.publish == true || (github.event_name == 'schedule' && vars.PROVE2ME_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure this environment separately only after reviewing the hosted test.
    environment: prove2me
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prove2me-checked
          path: batch
      - run: python3 -m pip install boto3==1.42.63
      - name: Publish checked data and checkpoint each provider receipt
        env:
          PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
          PROVE2ME_STATE: ${{ vars.PROVE2ME_STATE }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROVE2ME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROVE2ME_R2_SECRET_ACCESS_KEY }}
          DEADLINE: ${{ needs.inventory.outputs.deadline }}
        run: |
          test -n "$PROVE2ME_STATE"
          python3 scripts/prove2me/batch.py publish --directory batch --state "$PROVE2ME_STATE" --deadline "$DEADLINE" --publish
