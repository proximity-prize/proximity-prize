name: version guard
# Cheap contract checks kept when the heavy Lean CI was removed: fail if a served
# challenge version is hardcoded anywhere but challenges.json, or if benchmark.yml
# stops resolving it via challenges.py. Pure Python, seconds -- it exists so a
# version bump stays a one-line challenges.json edit and drift is loud.
on:
  pull_request:
    # Only where drift can happen -- never on a submission (Lean + score/radius),
    # so this workflow never runs on, or gates, a submission PR.
    paths:
      - challenges.json
      - benchmark.json
      - benchmark/comparator*.json
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

jobs:
  version-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Version drift guard
        run: python3 scripts/check-versions.py
      - name: Challenge isolation guard
        run: python3 scripts/check-track-isolation.py
      - name: Profile routing regressions
        run: python3 scripts/test-benchmark-profiles.py
