name = "proximity-prize"
defaultTargets = ["ProximityPrize"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Pin the Lean 4.33.1 / Mathlib migration from Verified-zkEVM/ArkLib#791.
# The manifest and score artifacts record this exact commit.
[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "3f3f045dd295834c262bd6f0d9dfdfee07cc8e76"

# Exact source of zksecurity/CompPoly#1, pending merge into its upstream repository.
# Use the merged upstream URL/SHA before activating the harness.
[[require]]
name = "CompPoly"
git = "https://github.com/yudduy/CompPoly"
rev = "61f39cdba1d15da9078e082a0c117cf60dfb99b3"

[[lean_lib]]
name = "ProximityPrize"
