name = "proximity-prize"
defaultTargets = ["ProximityPrize"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Pin the ArkLib 4.34.0 release and upstream CompPoly patch2. The direct
# CompPoly requirement preserves its kernel-replay fix across `lake update`.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "df591bb8c6745126d1d72f5243faae3022b0432a"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "fa14552d40e793f2ea26e65c440306aae0c08a26"

[[lean_lib]]
name = "ProximityPrize"
